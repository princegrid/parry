name: Deploy site

# Builds the static (snapshot-mode) site and publishes it to GitHub Pages.
# Server data is not baked in: the page reads snapshot.json from the data branch at runtime.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove the live API route (Pages cannot run server code)
        run: rm -rf src/app/api
      - name: Build static export
        run: npx next build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_DATA_SOURCE: snapshot
          NEXT_PUBLIC_SNAPSHOT_REPO: ${{ github.repository }}
          NEXT_PUBLIC_SNAPSHOT_BRANCH: data
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
