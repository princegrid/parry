name: Refresh snapshot now

# Manual refresh: publishes one snapshot immediately, alongside the running loop.
# Trigger from the Actions tab ("Run workflow") or: gh workflow run refresh.yml
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-once
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
